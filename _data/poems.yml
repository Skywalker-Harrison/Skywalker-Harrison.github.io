# Poems shown on /poems/. Each line has the original (`text`) and optional
# translations (`en`, `zh`). Add a new poem by copying a block.
- title: "El Poemo de l' Plugisto"
  author: "Ĥristo Gorov (Ĥrima)"
  lang: "eo"
  lines:
    - text: "Animo flugas en libero,"
      en: "The soul flies in freedom,"
      zh: "心灵在自由中飞翔，"
    - text: "super la valoj, ripozanta tero,"
      en: "above the valleys, the resting earth,"
      zh: "越过山谷，休憩的大地，"
    - text: "min lulas sorĉa dorm' magia,"
      en: "an enchanting, magical sleep lulls me,"
      zh: "魔力般的睡眠将我轻摇，"
    - text: "kvietas pacaj kor' kaj korpo miaj."
      en: "my peaceful heart and body grow still."
      zh: "我的心与身体安静平和。"

- title: "El Poemo de l' Plugisto"
  author: "Ĥristo Gorov (Ĥrima)"
  lang: "eo"
  lines:
    - text: "Mi dum vespero ŝatas kuŝi"
      en: "In the evening I like to lie"
      zh: "傍晚时我喜欢躺下"
    - text: "sub la ĉielo. Povas min kortuŝi"
      en: "beneath the sky. What can move me"
      zh: "在天空下。能打动我的"
    - text: "sur kamp' kavalo de l' ŝafisto,"
      en: "is the shepherd's kaval in the field,"
      zh: "是田野上牧羊人的笛子，"
    - text: "kavalo mieldolĉa de l' ŝafisto."
      en: "the shepherd's honey-sweet kaval."
      zh: "那蜜一般甘甜的牧笛。"

- title: "He Wishes for the Cloths of Heaven"
  author: "William Butler Yeats · [爱尔兰] 威廉·巴特勒·叶芝"
  lang: "en"
  lines:
    - text: "Had I the heavens’ embroidered cloths,"
      zh: "若我有天国的锦绣绸缎，"
    - text: "Enwrought with golden and silver light,"
      zh: "织满金色与银色的光芒，"
    - text: "The blue and the dim and the dark cloths"
      zh: "那湛蓝、昏暗与深黑的绸缎，"
    - text: "Of night and light and the half-light,"
      zh: "属于黑夜、白昼与微光，"
    - text: "I would spread the cloths under your feet:"
      zh: "我愿把它们铺在你的脚下："
    - text: "But I, being poor, have only my dreams;"
      zh: "可我一贫如洗，只有我的梦；"
    - text: "I have spread my dreams under your feet;"
      zh: "我已把我的梦铺在你的脚下；"
    - text: "Tread softly because you tread on my dreams."
      zh: "轻一点踩啊，因为你踩着我的梦。"
