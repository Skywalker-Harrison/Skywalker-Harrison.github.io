# Poems shown on /poems/. Each line has the original (`text`) and optional
# translations (`en`, `zh`). Add a new poem by copying a block.
- title: "El Poemo de l' Plugisto"
  author: "Ĥristo Gorov (Ĥrima)"
  lang: "eo"
  lines:
    - text: "Animo flugas en libero,"
      en: "The soul flies in freedom,"
      zh: "心灵在自由中飞翔，"
    - text: "super la valoj, ripozanta tero,"
      en: "above the valleys, the resting earth,"
      zh: "越过山谷，休憩的大地，"
    - text: "min lulas sorĉa dorm' magia,"
      en: "an enchanting, magical sleep lulls me,"
      zh: "魔力般的睡眠将我轻摇，"
    - text: "kvietas pacaj kor' kaj korpo miaj."
      en: "my peaceful heart and body grow still."
      zh: "我的心与身体安静平和。"

- title: "El Poemo de l' Plugisto"
  author: "Ĥristo Gorov (Ĥrima)"
  lang: "eo"
  lines:
    - text: "Mi dum vespero ŝatas kuŝi"
      en: "In the evening I like to lie"
      zh: "傍晚时我喜欢躺下"
    - text: "sub la ĉielo. Povas min kortuŝi"
      en: "beneath the sky. What can move me"
      zh: "在天空下。能打动我的"
    - text: "sur kamp' kavalo de l' ŝafisto,"
      en: "is the shepherd's kaval in the field,"
      zh: "是田野上牧羊人的笛子，"
    - text: "kavalo mieldolĉa de l' ŝafisto."
      en: "the shepherd's honey-sweet kaval."
      zh: "那蜜一般甘甜的牧笛。"

- title: "He Wishes for the Cloths of Heaven"
  author: "William Butler Yeats · [爱尔兰] 威廉·巴特勒·叶芝"
  lang: "en"
  lines:
    - text: "Had I the heavens’ embroidered cloths,"
      zh: "若我有天国的锦绣绸缎，"
    - text: "Enwrought with golden and silver light,"
      zh: "织满金色与银色的光芒，"
    - text: "The blue and the dim and the dark cloths"
      zh: "那湛蓝、昏暗与深黑的绸缎，"
    - text: "Of night and light and the half-light,"
      zh: "属于黑夜、白昼与微光，"
    - text: "I would spread the cloths under your feet:"
      zh: "我愿把它们铺在你的脚下："
    - text: "But I, being poor, have only my dreams;"
      zh: "可我一贫如洗，只有我的梦；"
    - text: "I have spread my dreams under your feet;"
      zh: "我已把我的梦铺在你的脚下；"
    - text: "Tread softly because you tread on my dreams."
      zh: "轻一点踩啊，因为你踩着我的梦。"

- title: "將進酒"
  author: "〔唐〕李白"
  lang: "zh"
  lines:
    - text: "君不見黃河之水天上來，奔流到海不復回。"
    - text: "君不見高堂明鏡悲白髮，朝如青絲暮成雪。"
    - text: "人生得意須盡歡，莫使金樽空對月。"
    - text: "天生我材必有用，千金散盡還復來。"
    - text: "烹羊宰牛且為樂，會須一飲三百杯。"
    - text: "岑夫子，丹丘生，將進酒，杯莫停。"
    - text: "與君歌一曲，請君為我傾耳聽。"
    - text: "鐘鼓饌玉不足貴，但願長醉不願醒。"
    - text: "古來聖賢皆寂寞，惟有飲者留其名。"
    - text: "陳王昔時宴平樂，斗酒十千恣歡謔。"
    - text: "主人何為言少錢，徑須沽取對君酌。"
    - text: "五花馬，千金裘，呼兒將出換美酒，與爾同銷萬古愁。"

# Haiku: three lines (5-7-5); the Chinese follows the same 5-7-5 count.
# `ruby` is the same line with kana readings (furigana) marked up; it is shown instead of `text`.
- title: "古池や"
  author: "松尾芭蕉"
  lang: "ja"
  lines:
    - text: "古池や"
      ruby: '<ruby>古池<rt>ふるいけ</rt></ruby>や'
      zh: "寂寂古池塘"
    - text: "蛙飛びこむ"
      ruby: '<ruby>蛙<rt>かわず</rt></ruby><ruby>飛<rt>と</rt></ruby>びこむ'
      zh: "青蛙一跃入水中"
    - text: "水の音"
      ruby: '<ruby>水<rt>みず</rt></ruby>の<ruby>音<rt>おと</rt></ruby>'
      zh: "扑通一声响"

- title: "閑さや"
  author: "松尾芭蕉"
  lang: "ja"
  lines:
    - text: "閑さや"
      ruby: '<ruby>閑<rt>しずか</rt></ruby>さや'
      zh: "四下多寂静"
    - text: "岩にしみ入る"
      ruby: '<ruby>岩<rt>いわ</rt></ruby>にしみ<ruby>入<rt>い</rt></ruby>る'
      zh: "蝉声阵阵透岩石"
    - text: "蝉の声"
      ruby: '<ruby>蝉<rt>せみ</rt></ruby>の<ruby>声<rt>こえ</rt></ruby>'
      zh: "渗入石中去"

- title: "菜の花や"
  author: "与謝蕪村"
  lang: "ja"
  lines:
    - text: "菜の花や"
      ruby: '<ruby>菜<rt>な</rt></ruby>の<ruby>花<rt>はな</rt></ruby>や'
      zh: "遍野菜花黄"
    - text: "月は東に"
      ruby: '<ruby>月<rt>つき</rt></ruby>は<ruby>東<rt>ひがし</rt></ruby>に'
      zh: "明月初升在东方"
    - text: "日は西に"
      ruby: '<ruby>日<rt>ひ</rt></ruby>は<ruby>西<rt>にし</rt></ruby>に'
      zh: "落日正西沉"

- title: "痩蛙"
  author: "小林一茶"
  lang: "ja"
  lines:
    - text: "痩蛙"
      ruby: '<ruby>痩蛙<rt>やせがえる</rt></ruby>'
      zh: "瘦弱小青蛙"
    - text: "まけるな一茶"
      ruby: 'まけるな<ruby>一茶<rt>いっさ</rt></ruby>'
      zh: "千万不要认输啊"
    - text: "是にあり"
      ruby: '<ruby>是<rt>これ</rt></ruby>にあり'
      zh: "一茶在这里"

- title: "柿くへば"
  author: "正岡子規"
  lang: "ja"
  lines:
    - text: "柿くへば"
      ruby: '<ruby>柿<rt>かき</rt></ruby>くへば'
      zh: "方才吃柿子"
    - text: "鐘が鳴るなり"
      ruby: '<ruby>鐘<rt>かね</rt></ruby>が<ruby>鳴<rt>な</rt></ruby>るなり'
      zh: "忽闻钟声悠悠响"
    - text: "法隆寺"
      ruby: '<ruby>法隆寺<rt>ほうりゅうじ</rt></ruby>'
      zh: "来自法隆寺"

# `stanza: true` on a line starts a new stanza (adds space above it).
- title: "Demain, dès l’aube"
  author: "Victor Hugo · [法] 维克多·雨果"
  lang: "fr"
  lines:
    - text: "Demain, dès l’aube, à l’heure où blanchit la campagne,"
      zh: "明天，拂晓，当原野泛白的时候，"
    - text: "Je partirai. Vois-tu, je sais que tu m’attends."
      zh: "我就动身。你知道，我明白你在等我。"
    - text: "J’irai par la forêt, j’irai par la montagne."
      zh: "我将穿过森林，我将翻越山岭。"
    - text: "Je ne puis demeurer loin de toi plus longtemps."
      zh: "我再也不能远离你更久。"
    - text: "Je marcherai les yeux fixés sur mes pensées,"
      zh: "我将一路走着，眼睛只盯着心中的思绪，"
      stanza: true
    - text: "Sans rien voir au dehors, sans entendre aucun bruit,"
      zh: "外面什么也不看，什么声音也不听，"
    - text: "Seul, inconnu, le dos courbé, les mains croisées,"
      zh: "独自一人，无人相识，弯着背，交叉着双手，"
    - text: "Triste, et le jour pour moi sera comme la nuit."
      zh: "满怀忧伤，白昼于我将如同黑夜。"
    - text: "Je ne regarderai ni l’or du soir qui tombe,"
      zh: "我不会看那落下的黄昏的金辉，"
      stanza: true
    - text: "Ni les voiles au loin descendant vers Harfleur,"
      zh: "也不会看远处驶向阿弗勒尔的帆影，"
    - text: "Et quand j’arriverai, je mettrai sur ta tombe"
      zh: "当我到达时，我要在你的墓上放下"
    - text: "Un bouquet de houx vert et de bruyère en fleur."
      zh: "一束青翠的冬青和盛开的欧石楠。"

- title: "Chanson d’automne"
  author: "Paul Verlaine · [法] 保尔·魏尔伦"
  lang: "fr"
  lines:
    - text: "Les sanglots longs"
      zh: "长长的呜咽，"
    - text: "Des violons"
      zh: "那是小提琴"
    - text: "De l’automne"
      zh: "在秋日里，"
    - text: "Blessent mon cœur"
      zh: "刺伤我的心，"
    - text: "D’une langueur"
      zh: "带着一种倦怠，"
    - text: "Monotone."
      zh: "单调不已。"
    - text: "Tout suffocant"
      zh: "一切令人窒息，"
      stanza: true
    - text: "Et blême, quand"
      zh: "面色苍白，当"
    - text: "Sonne l’heure,"
      zh: "钟声敲响，"
    - text: "Je me souviens"
      zh: "我便想起"
    - text: "Des jours anciens"
      zh: "往昔的日子，"
    - text: "Et je pleure ;"
      zh: "潸然泪下；"
    - text: "Et je m’en vais"
      zh: "于是我离去，"
      stanza: true
    - text: "Au vent mauvais"
      zh: "随那恶风"
    - text: "Qui m’emporte"
      zh: "将我卷走，"
    - text: "Deçà, delà,"
      zh: "忽东，忽西，"
    - text: "Pareil à la"
      zh: "就像一片"
    - text: "Feuille morte."
      zh: "枯叶。"

- title: "Sensation"
  author: "Arthur Rimbaud · [法] 阿尔蒂尔·兰波"
  lang: "fr"
  lines:
    - text: "Par les soirs bleus d’été, j’irai dans les sentiers,"
      zh: "夏日蓝色的傍晚，我将走在小径上，"
    - text: "Picoté par les blés, fouler l’herbe menue :"
      zh: "任麦芒轻刺，踏着细草："
    - text: "Rêveur, j’en sentirai la fraîcheur à mes pieds."
      zh: "恍如梦中，我会感到脚下的清凉。"
    - text: "Je laisserai le vent baigner ma tête nue."
      zh: "我要让风沐浴我裸露的头。"
    - text: "Je ne parlerai pas, je ne penserai rien :"
      zh: "我将不说话，什么也不想："
      stanza: true
    - text: "Mais l’amour infini me montera dans l’âme,"
      zh: "但无尽的爱会涌上我的灵魂，"
    - text: "Et j’irai loin, bien loin, comme un bohémien,"
      zh: "我将走得很远，很远，像个波希米亚人，"
    - text: "Par la Nature, — heureux comme avec une femme."
      zh: "走过大自然——幸福得如同有女子相伴。"
