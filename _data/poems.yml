# Poems shown on /poems/. Each line has the original (`text`) and optional
# translations (`en`, `zh`). Add a new poem by copying a block.
- title: "El Poemo de l' Plugisto"
  author: "Ĥristo Gorov (Ĥrima)"
  lang: "eo"
  lines:
    - text: "Animo flugas en libero,"
      en: "The soul flies in freedom,"
      zh: "心灵在自由中飞翔，"
    - text: "super la valoj, ripozanta tero,"
      en: "above the valleys, the resting earth,"
      zh: "越过山谷，休憩的大地，"
    - text: "min lulas sorĉa dorm' magia,"
      en: "an enchanting, magical sleep lulls me,"
      zh: "魔力般的睡眠将我轻摇，"
    - text: "kvietas pacaj kor' kaj korpo miaj."
      en: "my peaceful heart and body grow still."
      zh: "我的心与身体安静平和。"

- title: "El Poemo de l' Plugisto"
  author: "Ĥristo Gorov (Ĥrima)"
  lang: "eo"
  lines:
    - text: "Mi dum vespero ŝatas kuŝi"
      en: "In the evening I like to lie"
      zh: "傍晚时我喜欢躺下"
    - text: "sub la ĉielo. Povas min kortuŝi"
      en: "beneath the sky. What can move me"
      zh: "在天空下。能打动我的"
    - text: "sur kamp' kavalo de l' ŝafisto,"
      en: "is the shepherd's kaval in the field,"
      zh: "是田野上牧羊人的笛子，"
    - text: "kavalo mieldolĉa de l' ŝafisto."
      en: "the shepherd's honey-sweet kaval."
      zh: "那蜜一般甘甜的牧笛。"

- title: "He Wishes for the Cloths of Heaven"
  author: "William Butler Yeats · [爱尔兰] 威廉·巴特勒·叶芝"
  lang: "en"
  lines:
    - text: "Had I the heavens’ embroidered cloths,"
      zh: "若我有天国的锦绣绸缎，"
    - text: "Enwrought with golden and silver light,"
      zh: "织满金色与银色的光芒，"
    - text: "The blue and the dim and the dark cloths"
      zh: "那湛蓝、昏暗与深黑的绸缎，"
    - text: "Of night and light and the half-light,"
      zh: "属于黑夜、白昼与微光，"
    - text: "I would spread the cloths under your feet:"
      zh: "我愿把它们铺在你的脚下："
    - text: "But I, being poor, have only my dreams;"
      zh: "可我一贫如洗，只有我的梦；"
    - text: "I have spread my dreams under your feet;"
      zh: "我已把我的梦铺在你的脚下；"
    - text: "Tread softly because you tread on my dreams."
      zh: "轻一点踩啊，因为你踩着我的梦。"

- title: "將進酒"
  author: "〔唐〕李白"
  lang: "zh"
  lines:
    - text: "君不見黃河之水天上來，奔流到海不復回。"
      en: "Do you not see the Yellow River pouring down from heaven, rushing to the sea, never to return?"
    - text: "君不見高堂明鏡悲白髮，朝如青絲暮成雪。"
      en: "Do you not see, in the bright mirror of the high hall, the grief of white hair — black silk at dawn, snow by dusk?"
    - text: "人生得意須盡歡，莫使金樽空對月。"
      en: "When life goes well, drink joy to the full; never let a golden cup stand empty before the moon."
    - text: "天生我材必有用，千金散盡還復來。"
      en: "Heaven gave me talent, and it must have its use; a thousand in gold, once scattered, will come back again."
    - text: "烹羊宰牛且為樂，會須一飲三百杯。"
      en: "Boil the mutton, slaughter the ox, and let us be merry; we should down three hundred cups in one sitting."
    - text: "岑夫子，丹丘生，將進酒，杯莫停。"
      en: "Master Cen, young Danqiu — bring in the wine, and let no cup rest!"
    - text: "與君歌一曲，請君為我傾耳聽。"
      en: "I will sing you a song; please lend me your ears."
    - text: "鐘鼓饌玉不足貴，但願長醉不願醒。"
      en: "Bells and drums and jade-fine feasts are not worth prizing; I only wish to stay drunk and never wake."
    - text: "古來聖賢皆寂寞，惟有飲者留其名。"
      en: "Since ancient times the sages have all been forgotten; only the drinkers have left their names."
    - text: "陳王昔時宴平樂，斗酒十千恣歡謔。"
      en: "The Prince of Chen once feasted at Pingle Hall, with wine at ten thousand a measure and laughter without restraint."
    - text: "主人何為言少錢，徑須沽取對君酌。"
      en: "Why, my host, do you say the money is short? Just go and buy more, and I will pour for you."
    - text: "五花馬，千金裘，呼兒將出換美酒，與爾同銷萬古愁。"
      en: "The dappled horse, the fur worth a thousand in gold — call the boy to trade them for fine wine, and together we will drown the sorrows of ten thousand ages."
