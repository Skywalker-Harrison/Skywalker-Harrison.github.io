# Each item is one paragraph. HTML is allowed.
bio:
  - >
    Hi, I am <strong>Junhong (Harrison) Liang</strong>, a Ph.D. student in Natural Language
    Processing at MBZUAI. My research focuses on low-resource languages, multicultural and
    multimodal NLP, and AI safety. Recently I have been working on cultural alignment of
    Arabic language models, grammatical error correction with pedagogical feedback, and
    how LLMs handle closely related languages.
  - >
    Before MBZUAI, I received my master's degree in Pattern Recognition and Intelligent
    Systems from the Institute of Automation, Chinese Academy of Sciences (中国科学院自动化研究所),
    where I worked on Chinese spelling correction and ASR error correction, and my bachelor's
    degree in Physics, with a minor in Mathematics, from the University of Chinese Academy of
    Sciences (中国科学院大学).
  - >
    I am also a passionate foreign-language learner — English, French, Japanese, German and
    Esperanto so far — and I write about languages, research and life on my
    <a href="/blog/">blog</a>.

